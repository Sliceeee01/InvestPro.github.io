<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<nav class="navbar py-2 custom-navbar">

        <a class="navbar-brand d-flex align-items-center text-white" href="#"

            <img src="ikon.png"

    </div>

        <div class="card-body">
            <div class="row text-center">


                <!-- Т-Банк -->
                <div class="col-md-3 col-6 mb-3">
                    <a href = "https://www.tbank.ru/" class="btn btn-light border p-3 w-100 bank-btn" data-bank="tbank" style="cursor: pointer;">

                    </a>
                </div>
                
                <!-- Альфа Банк -->

                    <a href = "https://alfabank.ru/" class="btn btn-light border p-3 w-100 bank-btn" data-bank="alfa" style="cursor: pointer;">

                <!-- Сбер -->


                <div class="col-md-3 col-6 mb-3">

            </div>
